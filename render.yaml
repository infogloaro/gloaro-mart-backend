# Render Blueprint: New → Blueprint → pick this repo. Render creates the web
# service from this file and asks for each `sync: false` value (copy them from
# the backend's .env; DATABASE_URL is the Neon pooled connection string).
services:
  - type: web
    name: gloaro-mart-backend
    runtime: node
    # Next to the Neon database (AWS us-east-2).
    region: ohio
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Must equal the value already used to encrypt platform credentials in the database.
      - key: PLATFORM_SECRETS_KEY
        sync: false
      - key: PAYMENTS_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Link base for password-reset emails (the admin/web URL).
      - key: RESET_URL_BASE
        sync: false
      # Optional: AI search falls back to keyword search without it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Phone-login OTP texts via MSG91 (see .env.example). Without these,
      # production refuses phone sign-in instead of pretending to send.
      - key: SMS_PROVIDER
        value: msg91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
